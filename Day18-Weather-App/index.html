<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App ⚡</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app">
        <div class="header">
            <h1>⚡ Weather</h1>
            <p>Real time weather anywhere in the world</p>
        </div>
        <div class="search-area">
            <div class="search-box">
                <div>
                    <input type="text" id="city-input" autocomplete="off" placeholder="Search City...">
                    <button id="search-btn">🔍</button>
                </div>
            </div>
            <div id="error-msg" class="error-msg hidden">
                City not found! Please try again 🌍
            </div>
        </div>

        <div id="loading" class="loading hidden">
            <div class="spinner"></div>
            <p>Fetching Wether Data...</p>
        </div>

        <div id="weather-card" class="weather-card hidden">
            <div class="city-info">
                <h2 id="city-name">Srinagar</h2>
                <p id="city-country">IN</p>
            </div>

            <div id="weather-icon" class="weather-icon">
                🌨️
            </div>
        

        <div class="temp-section">
            <div class="temp-main" id="temp-main">-2°C</div>
            <div class="temp-desc" id="temp-desc">Light Snow</div>
            <div class="temp-feels" id="temp-feels">Feels like -6°C</div>
        </div>

        <div class="weather-details">
            <div class="detail-item">
                <span class="detail-icon">💧</span>
                <span class="detail-value" id="humidity">80%</span>
                <span class="detail-label">Humidity</span>
            </div>
            <div class="detail-item">
                <span class="detail-icon">💨</span>
                <span class="detail-value" id="wind-speed">12 km/h</span>
                <span class="detail-label">Wind</span>
            </div>
            <div class="detail-item">
                <span class="detail-icon">👁️</span>
                <span class="detail-value" id="visibility">5 km</span>
                <span class="detail-label">Visibility</span>
            </div>
            <div class="detail-item">
                <span class="detail-icon">🌡️</span>
                <span class="detail-value" id="feels-like">-6°C</span>
                <span class="detail-label">Feels Like</span>
            </div>
             </div>

            <div class="min-max">
                <div class="min-max-item">
                    <span>↑ High</span>
                    <span id="temp-max">-1°C</span>
                </div>
                <div class="divider"></div>
                <div class="min-max-item">
                    <span>↓ Low</span>
                    <span id="temp-min">-4°C</span>
                </div>
            </div>
       
        </div>

        <div id="history-section" class="history-section hidden">
            <h3>Recent Searches</h3>
            <div id="history-list" class="history-list"></div>
        </div>

    </div>


    <script src="script.js"></script>
</body>

</html>
