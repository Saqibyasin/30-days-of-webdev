<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Finder 👤</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app">

        <div class="header">
            <div class="logo">👤</div>
            <div class="content">
                <h1> GitHub Finder</h1>
                <p>Search any developer on GitHub</p>
            </div>
            
        </div>

        <div class="search-box">
            <input type="text" id="username-input" placeholder="Enter GitHub username..." autocomplete="off">
            <button id="search-btn">🔍</button>
        </div>

        <div id="error-msg" class="error-msg hidden">
            User not found! Check the username 👀
        </div>

        <div id="loading" class="loading hidden">
            <div class="spinner"></div>
            <p>Searching GitHub...</p>
        </div>

        <div id="profile-card" class="profile-card hidden">

            <div class="profile-top">
                <img id="avatar" src="" alt="Avatar" class="avatar" />
                <div class="profile-info">
                    <h2 id="profile-name">Kifayat Yaseen</h2>
                    <p id="profile-username">@saqibyasin</p>
                    <p id="profile-bio">Aspiring Frontend Developer</p>
                    <p id="profile-location">📍 Srinagar, Kashmir</p>
                </div>
            </div>




            <div class="profile-stats">
                <div class="stat">
                    <span id="stat-repos">0</span>
                    <p>Repos</p>
                </div>
                <div class="stat">
                    <span id="stat-followers">0</span>
                    <p>Followers</p>
                </div>
                <div class="stat">
                    <span id="stat-following">0</span>
                    <p>Following</p>
                </div>
                <div class="stat">
                    <span id="stat-gists">0</span>
                    <p>Gists</p>
                </div>
            </div>

            <div class="profile-links">
                <a id="github-link" href="#" target="_blank" class="profile-btn">
                    View on GitHub →
                </a>
            </div>

        </div>

        <div id="repos-section" class="repos-section hidden">
            <h3>📁 Repositories</h3>
            <div id="repos-list" class="repos-list"></div>
        </div>



    </div>


    <script src="script.js"></script>
</body>

</html>
