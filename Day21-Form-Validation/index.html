<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Form 📝</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>

    <div class="app">
        <div class="header">
            <h1>📝 Contact Me</h1>
            <p>Fill out the form and I'll get back to you!</p>
        </div>

        <form novalidate id="contact-form" class="form">

            <div class="form-group" id="name-group">
                <label for="name">Full Name *</label>
                <input type="text" id="name" placeholder="Enter your full name" autocomplete="off" />
                <span class="error-msg" id="name-error"></span>
            </div>

            <div class="form-group" id="email-group">
                <label for="email">Email Address *</label>
                <input type="email" id="email" placeholder="Enter your email" autocomplete="off" />
                <span class="error-msg" id="email-error"></span>
            </div>


            <div class="form-group" id="subject-group">
                <label for="subject">Subject *</label>
                <input type="text" id="subject" placeholder="What is this about?" autocomplete="off" />
                <span class="error-msg" id="subject-error"></span>
            </div>

            <div class="form-group" id="message-group">
                <label for="message">Message *</label>
                <textarea id="message" placeholder="Write your message here..." rows="5" maxlength="500"></textarea>
                <div class="char-counter">
                    <span class="error-msg" id="message-error"></span>
                    <span id="char-count">0/500</span>
                </div>
            </div>

            <button type="submit" id="submit-btn">
                Send Message 🚀
            </button>
        </form>

        <div id="success-msg" class="success-msg hidden">
            <span>✅</span>
            <div>
                <h3>Message Sent!</h3>
                <p>Thanks for reaching out! I'll get back to you soon.</p>
            </div>
        </div>

    </div>
    <script src="script.js"></script>
</body>

</html>
